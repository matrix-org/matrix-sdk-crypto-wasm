[package]
name = "matrix-sdk-crypto-wasm"
description = "Matrix encryption library, for JavaScript"
authors = ["Ivan Enderlin <ivane@element.io>"]
edition = "2021"
homepage = "https://github.com/matrix-org/matrix-sdk-crypto-wasm"
keywords = ["matrix", "chat", "messaging", "ruma", "nio"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/matrix-org/matrix-sdk-crypto-wasm"
rust-version = "1.70"
version = "0.0.0"
publish = false

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

################################################################################
#
# Configuration for `wasm-pack`
#
# See https://rustwasm.github.io/docs/wasm-pack/cargo-toml-configuration.html
# for details of what can be set here.
#
################################################################################

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[package.metadata.wasm-pack.profile.profiling.wasm-bindgen]
debug-js-glue = false
demangle-name-section = true
dwarf-debug-info = true

[package.metadata.wasm-pack.profile.release]
# Tell wasm-opt to:
#  * `-Oz`: optimise for size
#  * `-g`: include the "name" section (which holds the printable names for
#    symbols) in the output.
wasm-opt = ['-O3', '-g']

################################################################################

[profile.release]
# Tell cargo to run `rustc` with `-Oz` - ie, to optimize for size.
# https://doc.rust-lang.org/cargo/reference/profiles.html#opt-level
opt-level = 3
# Use a single codegen-unit to enable better optimizations
codegen-units = 1
# Enable fat link time optimization
lto = true

[lib]
crate-type = ["cdylib"]

[features]
default = ["qrcode"]
qrcode = ["matrix-sdk-crypto/qrcode", "dep:matrix-sdk-qrcode"]

[dependencies]
console_error_panic_hook = "0.1.7"
futures-util = "0.3.27"
http = "1.5.0"
js-sys = "0.3.105"
matrix-sdk-common = { version = "0.19.1", features = ["js",  "experimental-encrypted-state-events"] }
matrix-sdk-indexeddb = { version = "0.19.1", default-features = false, features = ["e2e-encryption"] }
matrix-sdk-qrcode = { version = "0.19.1", optional = true }
rustls-pki-types = { version = "1.15.1", optional = true, default-features = false, features = ["alloc", "web"] }
serde = "1.0.229"
serde_json = "1.0.151"
serde-wasm-bindgen = "0.6.5"
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "ansi"] }
url = "2.5.8"
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.78"
zeroize = "1.9.0"
wasm-bindgen-test = "0.3.78"

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build"] }

[dependencies.matrix-sdk-crypto]
version = "0.19.1"
default-features = false
features = ["js", "automatic-room-key-forwarding", "experimental-encrypted-state-events", "experimental-push-secrets", "experimental-x509-identity-verification", "rust-x509-verifier-impl"]

[lints.rust]
# Workaround for https://github.com/rustwasm/wasm-bindgen/issues/4283, while we work up the courage to upgrade
# wasm-bindgen
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(wasm_bindgen_unstable_test_coverage)'] }
